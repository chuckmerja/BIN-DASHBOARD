<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sun River Site - Grain Bin Dashboard</title>
  
  <!-- Chart.js CDN for Cable Temp & CO2 History Graphs -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    /* ==========================================================================
       1. COLOR SCHEME & GLOBAL STYLES
       ========================================================================== */
    :root {
      --bg-color: #0f172a;       /* Dark slate background */
      --card-bg: #1e293b;       /* Panel card background */
      --accent: #38bdf8;        /* Sky blue for bin highlights */
      --accent-hover: #f59e0b;  /* Amber for hovered bins */
      --text-main: #f8fafc;     /* Bright text */
      --text-muted: #94a3b8;    /* Subdued labels */
      --border-color: #334155;  /* Subtle divider lines */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Top Navigation Header */
    header {
      padding: 1rem 1.5rem;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 { font-size: 1.25rem; font-weight: 600; color: var(--text-main); }
    header p { font-size: 0.875rem; color: var(--text-muted); }

    /* Main Container Viewport */
    .viewport {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
      padding: 1rem;
    }

    /* ==========================================================================
       2. MAP CONTAINER & SVG SCALING FIXES
       ========================================================================== */
    .map-wrapper {
      position: relative;
      display: inline-block;
      width: 100%;
      max-width: 1755px; /* Locked to exact pixel width of site map */
      line-height: 0;    /* Kills invisible bottom inline spacing under <img> */
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border-color);
    }

    .map-wrapper img {
      display: block;
      width: 100%;
      height: auto;
      pointer-events: none; /* Mouse clicks pass directly through image to SVG */
    }

    /* SVG Overlay locked 1:1 over image container */
    .map-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* Interactive Circle & Rectangle Styles */
    .bin-node {
      fill: rgba(56, 189, 248, 0.25);
      stroke: #38bdf8;
      stroke-width: 2.5;
      cursor: pointer;
      pointer-events: all; /* Explicitly enables hover & click triggers */
      transition: all 0.2s ease-in-out;
    }

    /* Hover effect over bins */
    .bin-node:hover {
      fill: rgba(245, 158, 11, 0.45);
      stroke: #f59e0b;
      stroke-width: 3.5;
      filter: drop-shadow(0 0 6px rgba(245, 158, 11, 0.6));
    }

    /* Active selected bin style */
    .bin-node.active {
      fill: rgba(34, 197, 94, 0.5);
      stroke: #22c55e;
      stroke-width: 4;
    }

    /* Text Labels on Map Markers */
    .bin-label {
      fill: #ffffff;
      font-size: 13px;
      font-weight: 700;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none; /* Clicks pass through text to shape underneath */
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    }

    /* Smaller text size for Parker rectangle bins */
    .bin-label-sm {
      font-size: 10px;
    }

    /* ==========================================================================
       3. SLIDING DETAIL DRAWER STYLES
       ========================================================================== */
    .drawer {
      position: fixed;
      top: 0;
      right: -420px; /* Hidden off-screen by default */
      width: 400px;
      height: 100vh;
      background: var(--card-bg);
      border-left: 1px solid var(--border-color);
      box-shadow: -10px 0 30px rgba(0,0,0,0.5);
      transition: right 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 100;
      display: flex;
      flex-direction: column;
      padding: 1.5rem;
      overflow-y: auto;
    }

    .drawer.open { right: 0; } /* Slides into view when active */

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border-color);
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
    }
    .close-btn:hover { color: var(--text-main); }

    /* Quick Info Metric Grid */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .metric-card {
      background: rgba(15, 23, 42, 0.6);
      padding: 0.75rem 1rem;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    .metric-card .label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; }
    .metric-card .value { font-size: 1rem; font-weight: 700; margin-top: 0.2rem; color: var(--text-main); }

    .chart-container {
      margin-top: 1rem;
      background: rgba(15, 23, 42, 0.4);
      padding: 1rem;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    .chart-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>Sun River Grain Storage Site</h1>
      <p>Click any bin to load real-time status & sensor history</p>
    </div>
  </header>

  <div class="viewport">
    <div class="map-wrapper">
      
      <!-- Background site diagram image -->
      <img src="MFI_SR_BINSITE_ANNOTED.png" alt="Sun River Bin Map" id="site-map">

      <!-- 
        ==========================================================================
        4. ACCURATE SVG OVERLAY (Matched to 1755x1131 image coordinate space)
        ==========================================================================
      -->
      <svg class="map-overlay" viewBox="0 0 1755 1131" preserveAspectRatio="xMidYMid meet">

        <!-- LEFT COLUMN -->
        <g onclick="selectBin('SR4')">

        <g onclick="selectBin('SR3')">

        </g>

        <g onclick="selectBin('SR2')">
          <circle cx="256" cy="712" r="45" class="bin-node" id="node-SR2" />
          <text x="256" y="712" class="bin-label">SR2</text>
        </g>

        <g onclick="selectBin('SR7')">
          <circle cx="127" cy="803" r="45" class="bin-node" id="node-SR7" />
          <text x="127" y="803" class="bin-label">SR7</text>
        </g>

        <!-- CENTER BINS & CLUSTER -->
        <g onclick="selectBin('SR13')">
          <circle cx="381" cy="627" r="42" class="bin-node" id="node-SR13" />
          <text x="381" y="627" class="bin-label">SR13</text>
        </g>

        <g onclick="selectBin('SR9')">
          <circle cx="378" cy="782" r="42" class="bin-node" id="node-SR9" />
          <text x="378" y="782" class="bin-label">SR9</text>
        </g>

        <g onclick="selectBin('SR8')">
          <circle cx="373" cy="1073" r="45" class="bin-node" id="node-SR8" />
          <text x="373" y="1073" class="bin-label">SR8</text>
        </g>

        <g onclick="selectBin('SR5')">
          <circle cx="533" cy="663" r="55" class="bin-node" id="node-SR5" />
          <text x="533" y="663" class="bin-label">SR5</text>
        </g>

        <g onclick="selectBin('SR6')">
          <circle cx="678" cy="849" r="65" class="bin-node" id="node-SR6" />
          <text x="678" y="849" class="bin-label">SR6</text>
        </g>

        <!-- LARGE CENTER BINS -->
        <g onclick="selectBin('SR18')">
          <circle cx="678" cy="286" r="60" class="bin-node" id="node-SR18" />
          <text x="678" y="286" class="bin-label">SR18</text>
        </g>

        <g onclick="selectBin('SR17')">
          <circle cx="1054" cy="218" r="65" class="bin-node" id="node-SR17" />
          <text x="1054" y="218" class="bin-label">SR17</text>
        </g>

        <g onclick="selectBin('SR16')">
          <circle cx="886" cy="352" r="65" class="bin-node" id="node-SR16" />
          <text x="886" y="352" class="bin-label">SR16</text>
        </g>

        <g onclick="selectBin('SR15')">
          <circle cx="715" cy="494" r="65" class="bin-node" id="node-SR15" />
          <text x="715" y="494" class="bin-label">SR15</text>
        </g>

        <!-- QUONSET BINS -->
        <g onclick="selectBin('703')">
          <circle cx="903" cy="875" r="60" class="bin-node" id="node-703" />
          <text x="903" y="875" class="bin-label">703</text>
        </g>

        <g onclick="selectBin('704')">
          <circle cx="1036" cy="726" r="60" class="bin-node" id="node-704" />
          <text x="1036" y="726" class="bin-label">704</text>
        </g>

        <!-- RIGHT DIAGONAL ELEVATOR ARRAY -->
        <g onclick="selectBin('701')">
          <circle cx="1631" cy="217" r="55" class="bin-node" id="node-701" />
          <text x="1631" y="217" class="bin-label">701</text>
        </g>

        <g onclick="selectBin('702')">
          <circle cx="1472" cy="334" r="55" class="bin-node" id="node-702" />
          <text x="1572" y="334" class="bin-label">702</text>
        </g>

        <g onclick="selectBin('706')">
          <circle cx="1328" cy="463" r="55" class="bin-node" id="node-706" />
          <text x="1328" y="463" class="bin-label">706</text>
        </g>

        <g onclick="selectBin('705')">
          <circle cx="1197" cy="584" r="55" class="bin-node" id="node-705" />
          <text x="1197" y="584" class="bin-label">705</text>
        </g>

        <!-- PARKER SMALL RECTANGLES (Lower Left) -->
        <g onclick="selectBin('PKRW')">
          <rect x="116" y="896" width="40" height="50" rx="3" class="bin-node" id="node-PKRW" />
          <text x="136" y="921" class="bin-label bin-label-sm">PKRW</text>
        </g>

        <g onclick="selectBin('PKRM')">
          <rect x="163" y="896" width="40" height="50" rx="3" class="bin-node" id="node-PKRM" />
          <text x="183" y="921" class="bin-label bin-label-sm">PKRM</text>
        </g>

        <g onclick="selectBin('PKRE')">
          <rect x="209" y="896" width="40" height="50" rx="3" class="bin-node" id="node-PKRE" />
          <text x="229" y="921" class="bin-label bin-label-sm">PKRE</text>
        </g>

      </svg>
    </div>
  </div>

  <!-- ==========================================================================
     5. SLIDING DETAIL DRAWER HTML
     ========================================================================== -->
  <div class="drawer" id="bin-drawer">
    <div class="drawer-header">
      <h2 id="drawer-title">Bin Details</h2>
      <button class="close-btn" onclick="closeDrawer()">&times;</button>
    </div>

    <!-- Rapid Field Metrics -->
    <div class="metrics-grid">
      <div class="metric-card">
        <div class="label">Crop / Year</div>
        <div class="value" id="val-crop">--</div>
      </div>
      <div class="metric-card">
        <div class="label">Farm Unit</div>
        <div class="value" id="val-unit">--</div>
      </div>
      <div class="metric-card">
        <div class="label">Practice</div>
        <div class="value" id="val-prac">--</div>
      </div>
      <div class="metric-card">
        <div class="label">Protein</div>
        <div class="value" id="val-protein">--</div>
      </div>
      <div class="metric-card">
        <div class="label">Current Volume</div>
        <div class="value" id="val-bushels">--</div>
      </div>
      <div class="metric-card">
        <div class="label">CO₂ Level</div>
        <div class="value" id="val-co2">--</div>
      </div>
    </div>

    <!-- Chart.js Canvas Elements -->
    <div class="chart-container">
      <div class="chart-title">Cable Temp History (°F)</div>
      <canvas id="tempChart"></canvas>
    </div>

    <div class="chart-container">
      <div class="chart-title">CO₂ Trend (PPM)</div>
      <canvas id="co2Chart"></canvas>
    </div>
  </div>

  <!-- ==========================================================================
     6. JAVASCRIPT CONTROLLER LOGIC
     ========================================================================== -->
  <script>
    // Local Database Mock
    const binDatabase = {
      "SR1": {
        crop: "Dark Northern Spring", year: 2026, unit: "SR N/2521", prac: "Irrigated",
        bushels: "6,120 / 7,300 bu (84%)", protein: "14.8%", co2: "520 ppm",
        temps: [52, 54, 55, 57, 58, 60, 61],
        co2_history: [450, 470, 480, 500, 510, 515, 520]
      },
      "SR2": {
        crop: "Barley (Malting)", year: 2026, unit: "Fairhaven 17", prac: "Dryland",
        bushels: "3,100 / 3,900 bu (79%)", protein: "12.1%", co2: "480 ppm",
        temps: [48, 49, 50, 50, 51, 52, 52],
        co2_history: [420, 430, 440, 450, 460, 470, 480]
      },
      "SR4": {
        crop: "Hard Red Winter", year: 2025, unit: "Teichert S20", prac: "Irrigated",
        bushels: "6,800 / 7,173 bu (95%)", protein: "13.5%", co2: "850 ppm",
        temps: [60, 63, 67, 72, 78, 83, 89],
        co2_history: [500, 550, 620, 710, 780, 810, 850]
      },
      "SR14": {
        crop: "Dark Northern Spring", year: 2026, unit: "Sun River N/2521", prac: "Irrigated",
        bushels: "9,850 / 10,000 bu (98%)", protein: "15.1%", co2: "510 ppm",
        temps: [50, 51, 51, 52, 53, 53, 54],
        co2_history: [460, 470, 480, 490, 500, 505, 510]
      },
      "SR18": {
        crop: "Empty", year: "-", unit: "-", prac: "-",
        bushels: "0 / 7,500 bu (0%)", protein: "-", co2: "400 ppm",
        temps: [45, 45, 45, 46, 46, 45, 45],
        co2_history: [400, 400, 400, 400, 400, 400, 400]
      }
    };

    let tempChartInstance = null;
    let co2ChartInstance = null;

    function selectBin(binId) {
      // Highlight active node
      document.querySelectorAll('.bin-node').forEach(node => node.classList.remove('active'));
      const activeNode = document.getElementById(`node-${binId}`);
      if (activeNode) activeNode.classList.add('active');

      // Fetch bin info or use unassigned default
      const data = binDatabase[binId] || {
        crop: "Unassigned", year: "-", unit: "-", prac: "-",
        bushels: "N/A", protein: "N/A", co2: "N/A",
        temps: [0,0,0,0,0,0,0], co2_history: [0,0,0,0,0,0,0]
      };

      // Populate UI
      document.getElementById('drawer-title').innerText = `Bin ${binId}`;
      document.getElementById('val-crop').innerText = `${data.crop} (${data.year})`;
      document.getElementById('val-unit').innerText = data.unit;
      document.getElementById('val-prac').innerText = data.prac;
      document.getElementById('val-protein').innerText = data.protein;
      document.getElementById('val-bushels').innerText = data.bushels;
      document.getElementById('val-co2').innerText = data.co2;

      // Render Charts
      renderCharts(data.temps, data.co2_history);

      // Open Drawer
      document.getElementById('bin-drawer').classList.add('open');
    }

    function closeDrawer() {
      document.getElementById('bin-drawer').classList.remove('open');
      document.querySelectorAll('.bin-node').forEach(node => node.classList.remove('active'));
    }

    function renderCharts(tempData, co2Data) {
      const labels = ['7d ago', '6d ago', '5d ago', '4d ago', '3d ago', '2d ago', 'Today'];

      if (tempChartInstance) tempChartInstance.destroy();
      if (co2ChartInstance) co2ChartInstance.destroy();

      // Temperature Chart
      const ctxTemp = document.getElementById('tempChart').getContext('2d');
      tempChartInstance = new Chart(ctxTemp, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: 'Top Cable (°F)',
            data: tempData,
            borderColor: '#38bdf8',
            backgroundColor: 'rgba(56, 189, 248, 0.1)',
            fill: true,
            tension: 0.3
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } },
            y: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }
          }
        }
      });

      // CO2 Chart
      const ctxCo2 = document.getElementById('co2Chart').getContext('2d');
      co2ChartInstance = new Chart(ctxCo2, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: 'CO2 (PPM)',
            data: co2Data,
            borderColor: '#f59e0b',
            backgroundColor: 'rgba(245, 158, 11, 0.1)',
            fill: true,
            tension: 0.3
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } },
            y: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }
          }
        }
      });
    }

    // CALIBRATION TOOL: Click anywhere on the map to log exact SVG coordinates
    document.querySelector('.map-wrapper').addEventListener('click', e => {
      const svg = document.querySelector('.map-overlay');
      const rect = svg.getBoundingClientRect();
      
      const x = Math.round(((e.clientX - rect.left) / rect.width) * 1755);
      const y = Math.round(((e.clientY - rect.top) / rect.height) * 1131);
      
      console.log(`CLICKED COORDINATE: cx="${x}" cy="${y}"`);
    });
  </script>
</body>
</html>
